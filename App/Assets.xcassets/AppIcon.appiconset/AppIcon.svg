<!-- Source for AppIcon-1024.png. Regenerate with:
     python -c "import cairosvg,io; from PIL import Image; png=cairosvg.svg2png(url='AppIcon.svg', output_width=1024, output_height=1024); im=Image.open(io.BytesIO(png)).convert('RGBA'); bg=Image.new('RGB', im.size, '#FFFFFF'); bg.paste(im, mask=im.split()[3]); bg.save('AppIcon-1024.png')"
     Flat, full bleed, no rounded corners: iOS applies its own mask. Nothing sits closer than 90 px to an edge.

     iOS 18 also ships dark and tinted variants (transparent background, no
     white rect, glyph recolored). They reuse this file's exact geometry but
     need per-shape color overrides that a plain string-replace on this SVG
     can't express (the arrow and the first list bar share the same source
     hex but take different target colors), so they're built by
     scripts/render_app_icon.py instead of an inline one-liner. Regenerate
     both, or all three, with:
       python scripts/render_app_icon.py dark
       python scripts/render_app_icon.py tinted
       python scripts/render_app_icon.py all
     dark:   background transparent; violet accent (#6C3FD1) -> #8F6EFF
             (SharedAssets dark accent); near-black strokes/bars (#1C1B1F)
             -> white (would be invisible on Apple's dark gradient otherwise).
     tinted: background transparent; whole glyph grayscale (R==G==B) so
             Apple's tint recolors it by luminance. Messy strokes + the
             four-bar list (the two dominant masses) -> near white (#F2F2F2)
             as the "main" strokes; the small connecting arrow -> mid-gray
             (#808080) as the "secondary" detail. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#FFFFFF"/>

  <!-- Messy strokes, top left: four uneven lines, the first two meeting at a corner. -->
  <g stroke="#1C1B1F" stroke-width="58" stroke-linecap="round" fill="none">
    <line x1="215" y1="215" x2="430" y2="150"/>
    <line x1="300" y1="205" x2="430" y2="285"/>
    <line x1="135" y1="350" x2="305" y2="450"/>
    <line x1="320" y1="380" x2="480" y2="340"/>
  </g>

  <!-- Arrow from the mess to the list, violet (the app accent). -->
  <line x1="515" y1="445" x2="548" y2="498" stroke="#6C3FD1" stroke-width="40" stroke-linecap="round"/>
  <polygon points="597,547 579,466 516,529" fill="#6C3FD1"/>

  <!-- Tidy list, bottom right: four aligned bars, the first one violet. -->
  <rect x="490" y="560" width="421" height="57" rx="28.5" fill="#6C3FD1"/>
  <rect x="490" y="664" width="421" height="57" rx="28.5" fill="#1C1B1F"/>
  <rect x="490" y="768" width="421" height="57" rx="28.5" fill="#1C1B1F"/>
  <rect x="490" y="872" width="321" height="57" rx="28.5" fill="#1C1B1F"/>
</svg>
