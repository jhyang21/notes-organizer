# TEMPORARY — remove after one dispatch.
#
# MATCH_PASSWORD was generated randomly and set write-only; its plaintext
# exists nowhere outside GitHub. This exports it once, encrypted to a
# throwaway RSA key held only on the maintainer's machine, so it can be
# copied to the relora-ios repo (which shares the certificates repo).
# The plaintext never appears in logs or in the artifact.
name: Export match password (temporary)

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt MATCH_PASSWORD to maintainer public key
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          if [ -z "$MATCH_PASSWORD" ]; then echo "MATCH_PASSWORD missing" >&2; exit 1; fi
          cat > pub.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAmRVMciyDkQpWrMOAVUcH
          jbXn9b3CVZOoJSnPqj0aCqQcIbWgC6VwLLkiuVNyBDgIziYn0rS+wy8rEBuiY6KD
          f0gIZ/tmYRistcOmI852XU15QNTrA/axHR2IidsWaj7PBmPtRcT6s8wT1lqtp9Xz
          yHqBY5y9XSucwvLq2FtaVwKqkDp3bI6GIocU8Dhbg0HdmCYxmadOxcCDICcQ4FSF
          gstp8MjR7zKNQgmcilSqrwjv+lxtvwposoWjxedcnHTjHsOcU91tvTkC+PsroAYK
          amDpsFi1si5iv82J9JhM7ZCUziK1ooK1vvkPD1CVYUuMbT9chsrJvZRQwhZVfE0r
          JwIDAQAB
          -----END PUBLIC KEY-----
          EOF
          printf '%s' "$MATCH_PASSWORD" | openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -out mp.bin

      - name: Upload encrypted blob
        uses: actions/upload-artifact@v4
        with:
          name: mp
          path: mp.bin
          retention-days: 1
