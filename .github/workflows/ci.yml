name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_26.4.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.1.app
          else
            echo "Xcode_26.4.1.app not found on this runner; using default Xcode."
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Discover an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          DEVICE_INFO=$(xcrun simctl list devices available --json | jq -r '
            .devices
            | to_entries[]
            | select(.key | contains("iOS"))
            | .value[]
            | select(.isAvailable == true and (.name | startswith("iPhone")))
            | "\(.udid)|\(.name)"
          ' | head -n1)
          if [ -z "$DEVICE_INFO" ]; then
            echo "No available iPhone simulator found." >&2
            xcrun simctl list runtimes
            exit 1
          fi
          UDID="${DEVICE_INFO%%|*}"
          NAME="${DEVICE_INFO##*|}"
          echo "Selected simulator: $NAME ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build app + share extension (unsigned)
        run: |
          xcodebuild build \
            -project NotesOrganizer.xcodeproj \
            -scheme NotesOrganizer \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Test the app (NotesOrganizerTests)
        run: |
          xcodebuild test \
            -project NotesOrganizer.xcodeproj \
            -scheme NotesOrganizer \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Test NotesOrganizerKit
        run: |
          cd Packages/NotesOrganizerKit
          xcodebuild test \
            -scheme NotesOrganizerKit \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"

  edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/tidynote_organize/index.ts
      - run: deno test --allow-net --allow-env supabase/functions/tidynote_organize/
