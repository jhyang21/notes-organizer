name: NotesOrganizer
options:
  bundleIdPrefix: com.immform
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    DEVELOPMENT_TEAM: SUFCW5V2QV
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  NotesOrganizerKit:
    path: Packages/NotesOrganizerKit
  # The repo's only external dependency, and it belongs to the app alone.
  # The SPM-only mirror rather than `purchases-ios`, whose repository also
  # carries the Xcode project and its checked-in binaries.
  #
  # Pinned exactly: Package.resolved lives inside the generated (gitignored)
  # .xcodeproj, so this line is the only lockfile the repo has. Upgrades are
  # a deliberate edit here, not whatever CI resolves on release day.
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    exactVersion: 5.83.1

targets:
  NotesOrganizer:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: NotesOrganizerKit
      # App target only. The share extension reads `EntitlementStore` and
      # never buys anything, and the kit stays SDK-free so its tests stay
      # network-free.
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
      - target: ShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.immform.notesorganizer
        PRODUCT_NAME: NotesOrganizer
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        # Manual signing needs the profile pinned at archive time; gym's
        # export mapping alone is too late. Ignored when
        # CODE_SIGNING_ALLOWED=NO (CI simulator builds).
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: match AppStore com.immform.notesorganizer
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    dependencies:
      - package: NotesOrganizerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.immform.notesorganizer.share
        PRODUCT_NAME: ShareExtension
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: match AppStore com.immform.notesorganizer.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO

  # App-layer tests. Hosted by the app, so the app's own launch path runs
  # first — which is why `NotesOrganizerApp` skips RevenueCat under
  # `XCTestConfigurationFilePath`.
  NotesOrganizerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/App
      # An app extension is not an importable module, so the two files worth
      # testing are compiled into the test bundle itself.
      - path: ShareExtension/ShareViewModel.swift
      - path: ShareExtension/SharedTextLoader.swift
    dependencies:
      - target: NotesOrganizer
      - package: NotesOrganizerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.immform.notesorganizer.tests
        PRODUCT_NAME: NotesOrganizerTests
        # Written out rather than left to the generator: the host is what
        # makes `@testable import NotesOrganizer` resolve, and a silently
        # host-less test bundle fails in a way that reads like a code error.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/NotesOrganizer.app/NotesOrganizer
        BUNDLE_LOADER: $(TEST_HOST)
        # Nothing in a test bundle's plist is ours to own, and there is no
        # signing to pin: CI runs with CODE_SIGNING_ALLOWED=NO.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  NotesOrganizer:
    build:
      targets:
        NotesOrganizer: all
        ShareExtension: all
        NotesOrganizerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NotesOrganizerTests
    archive:
      config: Release
